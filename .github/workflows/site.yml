name: Check opportunities and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,17 * * *' # Twice daily, UTC (GitHub scheduling may be delayed)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Run advisor engine tests
        run: node tests/advisor.test.js
      - name: Check official sources (safe failure handling)
        run: python scripts/update_opportunities.py
      - name: Commit verified public-feed changes only
        run: |
          git config user.name "researchtrack-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/opportunities.js data/changes.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified program metadata"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static public files only
        run: |
          mkdir -p dist/data
          cp index.html app.js advisor.js styles.css .nojekyll dist/
          cp data/opportunities.json data/opportunities.js data/changes.json dist/data/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
